<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReviewSetu</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="brand">ReviewSetu</span>
      <div class="header-actions">
        <button id="start-over" class="start-over-btn" type="button">Start Over</button>
        <div class="lang-picker">
          <button id="lang-toggle" class="lang-toggle" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
          <ul id="lang-menu" class="lang-menu hidden" role="listbox"></ul>
        </div>
      </div>
    </header>
    <main id="app-main" class="app-main"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
